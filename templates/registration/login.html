{% extends "base.html" %}
{% block title %}Вход — АвтоСервис{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card auth-card shadow-sm mt-5">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <i class="bi bi-wrench-adjustable-circle display-5 text-primary"></i>
        </div>
        <h1 class="h4 mb-1 text-center">Вход в систему</h1>
        <p class="text-muted text-center small mb-4">Информационная система автосервиса</p>
        {% if form.errors %}
          <div class="alert alert-danger py-2 small">Неверное имя пользователя или пароль.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Имя пользователя</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Пароль</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
