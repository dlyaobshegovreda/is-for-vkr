{% extends "base.html" %}
{% block title %}Удаление — АвтоСервис{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-danger"><div class="card-body p-4">
      <h1 class="h4 mb-3 text-danger"><i class="bi bi-exclamation-triangle me-1"></i>Подтверждение удаления</h1>
      <p class="mb-4">Удалить запись «<strong>{{ object }}</strong>»? Действие необратимо.</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Удалить</button>
          <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Отмена</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
